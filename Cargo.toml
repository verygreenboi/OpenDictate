[package]
name = "open-typeless"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
eframe = "0.37"
enigo = "0.6"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }
